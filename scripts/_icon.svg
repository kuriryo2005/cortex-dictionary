<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1A1C1E"/>
  <!-- 語源でつながるノード。アプリの中心的な体験（ナレッジマップ）を図にしたもの -->
  <g stroke="#2A5CFF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="256" y1="256" x2="150" y2="150"/>
    <line x1="256" y1="256" x2="368" y2="170"/>
    <line x1="256" y1="256" x2="160" y2="360"/>
    <line x1="256" y1="256" x2="372" y2="352"/>
  </g>
  <circle cx="256" cy="256" r="52" fill="#ffffff"/>
  <g fill="#2A5CFF">
    <circle cx="150" cy="150" r="30"/>
    <circle cx="368" cy="170" r="24"/>
    <circle cx="160" cy="360" r="24"/>
    <circle cx="372" cy="352" r="30"/>
  </g>
</svg>
